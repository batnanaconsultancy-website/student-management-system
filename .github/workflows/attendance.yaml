name: Canvas Masters Google Meet Attendance

on:
  schedule:
    - cron: '17 6 * * *'
      timezone: Europe/Amsterdam
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canvas-masters-meet-attendance
  cancel-in-progress: false

jobs:
  sync-attendance:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate and sync Google Meet attendance
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ROLE_KEY: ${{ secrets.SUPABASE_ROLE_KEY }}
          MASTERS_ATTENDANCE_GOOGLE_CLIENT_ID: ${{ secrets.MASTERS_ATTENDANCE_GOOGLE_CLIENT_ID }}
          MASTERS_ATTENDANCE_GOOGLE_CLIENT_SECRET: ${{ secrets.MASTERS_ATTENDANCE_GOOGLE_CLIENT_SECRET }}
          MASTERS_ATTENDANCE_REFRESH_TOKEN: ${{ secrets.MASTERS_ATTENDANCE_REFRESH_TOKEN }}
          MEET_ATTENDANCE_START: ${{ vars.MEET_ATTENDANCE_START }}
        run: |
          python -m py_compile scripts/inspect_meet_email.py scripts/sync_masters_attendance.py
          python scripts/sync_masters_attendance.py
