name: Bachelor's Attendance Ledger Dry Run

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bachelor-attendance-ledger-dry-run
  cancel-in-progress: false

jobs:
  attendance-dry-run:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install importer dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "supabase==2.3.4" \
            "python-dotenv==1.0.1" \
            "google-auth>=2.29,<3" \
            "google-api-python-client>=2.120,<3"

      - name: Run importer tests
        run: |
          python -m unittest discover \
            -s tests \
            -p 'test_bachelor_attendance_importer.py' \
            -v

      - name: Run read-only attendance dry-run
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_ROLE_KEY: ${{ secrets.SUPABASE_ROLE_KEY }}
        run: |
          python scripts/import_bachelor_attendance.py
