name: Deploy SIS to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: sis-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH with retry
        env:
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
        run: |
          set -e

          KEY_FILE="$RUNNER_TEMP/vps_deploy_key"

          printf '%s\n' "$VPS_DEPLOY_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          cleanup() {
            rm -f "$KEY_FILE"
          }

          trap cleanup EXIT

          echo "== Testing SSH connection and deploying =="

          for attempt in 1 2 3; do
            echo ""
            echo "=========================================="
            echo "Deployment attempt $attempt of 3"
            echo "=========================================="

            if ssh \
              -i "$KEY_FILE" \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=30 \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=3 \
              root@31.97.34.52 << 'REMOTE_SCRIPT'
          set -e

          cd /root/student-management-system

          echo "== Pulling latest code =="
          git fetch origin main
          git reset --hard origin/main

          echo "== Deployed commit =="
          git rev-parse --short HEAD
          git log -1 --oneline

          echo "== Cleaning Nuxt generated files =="
          rm -rf .output
          rm -rf .nuxt
          rm -rf node_modules/.cache/nuxt

          echo "== Installing dependencies =="
          npm install

          echo "== Building Nuxt application =="
          npm run build

          echo "== Verifying production build =="
          test -f .output/server/index.mjs

          echo "Build output:"
          ls -lh .output/server/index.mjs

          echo "== Restarting application =="
          pm2 restart student-management-system --update-env

          echo "== Checking application status =="
          pm2 status student-management-system

          echo "== Deployment complete =="
          REMOTE_SCRIPT
            then
              echo ""
              echo "=========================================="
              echo "Deployment succeeded on attempt $attempt"
              echo "=========================================="
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo ""
              echo "Deployment attempt $attempt failed."
              echo "Waiting 20 seconds before retrying..."
              sleep 20
            fi
          done

          echo ""
          echo "=========================================="
          echo "Deployment failed after 3 attempts."
          echo "=========================================="
          exit 1
