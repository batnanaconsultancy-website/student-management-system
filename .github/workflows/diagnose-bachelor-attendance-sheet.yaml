name: Diagnose Bachelor's Attendance Sheet

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bachelor-attendance-sheet-diagnostic
  cancel-in-progress: false

jobs:
  inspect-sheet:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install read-only inspection dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gspread google-auth

      - name: Audit Bachelor's attendance worksheets
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from collections import Counter
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from hashlib import sha256

          import gspread
          from google.oauth2.service_account import Credentials

          SPREADSHEET_ID = "1LQum-XZSTaun1cJ7AHxjS63JLGzMPFpCWEAES6gNZTg"
          CANDIDATE_GIDS = {334409729, 394749220}

          EMAIL_HEADER = "Please enter your Amsterdam Tech email address"
          TIMESTAMP_HEADER = "Timestamp"
          DATE_HEADER = "What date was the session you attended?"
          TYPE_HEADER = "Which session is this form for?"
          LIVE_HEADER = "Did you attend this session live?"

          def parse_date(value):
              value = (value or "").strip()
              if not value:
                  return None
              for fmt in ("%d/%m/%Y", "%Y-%m-%d", "%d-%m-%Y"):
                  try:
                      return datetime.strptime(value, fmt).date()
                  except ValueError:
                      pass
              return None

          def parse_timestamp(value):
              value = (value or "").strip()
              if not value:
                  return None
              for fmt in (
                  "%d/%m/%Y %H:%M:%S",
                  "%d/%m/%Y %H:%M",
                  "%Y-%m-%d %H:%M:%S",
                  "%Y-%m-%dT%H:%M:%S",
                  "%Y-%m-%dT%H:%M:%S.%f",
              ):
                  try:
                      return datetime.strptime(value, fmt)
                  except ValueError:
                      pass
              try:
                  return datetime.fromisoformat(value.replace("Z", "+00:00")).replace(
                      tzinfo=None
                  )
              except ValueError:
                  return None

          def cell(row, index):
              return row[index].strip() if index < len(row) else ""

          def normalized_type(value):
              value = " ".join((value or "").casefold().split())
              aliases = {
                  "mentoring": "Mentoring",
                  "squad meeting": "Squad Meeting",
                  "stand-up": "Stand-up",
                  "stand up": "Stand-up",
                  "standup": "Stand-up",
                  "workshop": "Workshop",
                  "workshops": "Workshop",
              }
              return aliases.get(value, value)

          def normalized_live(value):
              value = " ".join((value or "").casefold().split())
              value = value.replace("–", "-").replace("—", "-")
              if value == "yes":
                  return "Yes"
              if value.startswith("no") and "approved" in value and "exceptional" in value:
                  return "No - approved exceptional circumstances"
              if not value:
                  return "Blank"
              return "Other"

          raw_credentials = os.environ.get("GOOGLE_CREDENTIALS_JSON")
          if not raw_credentials:
              raise RuntimeError("GOOGLE_CREDENTIALS_JSON secret is missing.")

          credentials = Credentials.from_service_account_info(
              json.loads(raw_credentials),
              scopes=["https://www.googleapis.com/auth/spreadsheets.readonly"],
          )
          spreadsheet = gspread.authorize(credentials).open_by_key(SPREADSHEET_ID)

          print("Spreadsheet:", spreadsheet.title)
          print("Candidate worksheet GIDs:", sorted(CANDIDATE_GIDS))

          audits = {}
          audit_details = {}

          for ws in spreadsheet.worksheets():
              if ws.id not in CANDIDATE_GIDS:
                  print(f"Metadata only: {ws.title} (GID {ws.id})")
                  continue

              print(f"\n===== AUDIT: {ws.title} | GID {ws.id} =====")
              values = ws.get_all_values()
              if not values:
                  print("Worksheet is empty.")
                  audits[ws.id] = set()
                  audit_details[ws.id] = {}
                  continue

              headers = [h.strip() for h in values[0]]

              required = {
                  "timestamp": TIMESTAMP_HEADER,
                  "email": EMAIL_HEADER,
                  "date": DATE_HEADER,
                  "type": TYPE_HEADER,
              }
              indexes = {}
              for key, header in required.items():
                  matches = [i for i, value in enumerate(headers) if value == header]
                  if len(matches) != 1:
                      raise RuntimeError(
                          f"{ws.title}: expected exactly one '{header}' header; "
                          f"found {len(matches)}."
                      )
                  indexes[key] = matches[0]

              live_matches = [
                  i for i, value in enumerate(headers) if value == LIVE_HEADER
              ]
              if len(live_matches) > 1:
                  raise RuntimeError(
                      f"{ws.title}: found multiple '{LIVE_HEADER}' headers."
                  )

              indexes["live"] = live_matches[0] if live_matches else None
              print(
                  "Live-attendance column:",
                  f"present at column {indexes['live'] + 1}"
                  if indexes["live"] is not None
                  else "unavailable in this worksheet"
              )

              print("Data rows:", max(0, len(values) - 1))
              print("Using exact headers; no fuzzy column matching.")

              date_counts = Counter()
              year_counts = Counter()
              live_by_type = {}
              type_counts = Counter()
              live_counts = Counter()
              dates_before_2000 = 0
              dates_before_2020 = 0
              future_dates = 0
              audit_date = datetime.now(ZoneInfo("Europe/Amsterdam")).date()
              missing_email = 0
              invalid_email = 0
              missing_date = 0
              invalid_date = 0
              missing_timestamp = 0
              invalid_timestamp = 0
              missing_type = 0
              unknown_types = Counter()
              valid_dates = []
              signatures = []
              signature_records = {}

              for row in values[1:]:
                  if not any((value or "").strip() for value in row):
                      continue

                  email = cell(row, indexes["email"]).casefold()
                  session_date_raw = cell(row, indexes["date"])
                  timestamp_raw = cell(row, indexes["timestamp"])
                  session_type_raw = cell(row, indexes["type"])
                  live_raw = (
                      cell(row, indexes["live"])
                      if indexes["live"] is not None
                      else None
                  )

                  if not email:
                      missing_email += 1
                  elif not re.fullmatch(r"[^@\s]+@[^@\s]+\.[^@\s]+", email):
                      invalid_email += 1

                  if not session_date_raw:
                      missing_date += 1
                      session_date = None
                  else:
                      session_date = parse_date(session_date_raw)
                      if session_date is None:
                          invalid_date += 1
                      else:
                          valid_dates.append(session_date)
                          year_counts[session_date.year] += 1
                          if session_date.year < 2000:
                              dates_before_2000 += 1
                          if session_date.year < 2020:
                              dates_before_2020 += 1
                          if session_date > audit_date:
                              future_dates += 1

                  if not timestamp_raw:
                      missing_timestamp += 1
                      timestamp = None
                  else:
                      timestamp = parse_timestamp(timestamp_raw)
                      if timestamp is None:
                          invalid_timestamp += 1

                  if not session_type_raw:
                      missing_type += 1
                      session_type = ""
                  else:
                      session_type = normalized_type(session_type_raw)
                      if session_type not in {
                          "Mentoring", "Squad Meeting", "Stand-up", "Workshop"
                      }:
                          unknown_types[session_type_raw.strip()] += 1

                  if session_type:
                      type_counts[session_type] += 1

                  if indexes["live"] is not None:
                      live_value = normalized_live(live_raw)
                      live_counts[live_value] += 1
                      if session_type:
                          if session_type not in live_by_type:
                              live_by_type[session_type] = Counter()
                          live_by_type[session_type][live_value] += 1

                  # A complete signature includes submission timestamp as well as
                  # normalized email, actual session date, and session type.
                  # This avoids collapsing two same-day sessions by one student.
                  email_is_valid = bool(
                      re.fullmatch(r"[^@\s]+@[^@\s]+\.[^@\s]+", email)
                  )

                  if email_is_valid and session_date and timestamp and session_type:
                      signature = (
                          email,
                          session_date.isoformat(),
                          session_type.casefold(),
                          timestamp.isoformat(),
                      )
                      signature_hash = sha256(
                          "|".join(signature).encode("utf-8")
                      ).hexdigest()
                      signatures.append(signature_hash)
                      signature_records[signature_hash] = {
                          "session_date": session_date.isoformat(),
                          "session_type": session_type,
                          "live_column_available": indexes["live"] is not None,
                          "live_status": (
                              normalized_live(live_raw)
                              if indexes["live"] is not None
                              else "Unavailable"
                          ),
                      }

              signature_set = set(signatures)
              audits[ws.id] = signature_set
              audit_details[ws.id] = signature_records

              print("Session date range:",
                    min(valid_dates).isoformat() if valid_dates else "Unavailable",
                    "to",
                    max(valid_dates).isoformat() if valid_dates else "Unavailable")
              print("Audit date:", audit_date.isoformat())
              print("Session records by year:", dict(sorted(year_counts.items())))
              print("Session dates before 2000:", dates_before_2000)
              print("Session dates before 2020:", dates_before_2020)
              print("Future-dated session records:", future_dates)
              print("Missing session dates:", missing_date)
              print("Invalid session dates:", invalid_date)
              print(
                  "Records unassignable to an assessment period "
                  "(missing or invalid session date):",
                  missing_date + invalid_date,
              )
              print("Missing student emails:", missing_email)
              print("Invalid-format student emails:", invalid_email)
              print("Missing submission timestamps:", missing_timestamp)
              print("Invalid submission timestamps:", invalid_timestamp)
              print("Missing session types:", missing_type)
              print("Counts by session type:", dict(sorted(type_counts.items())))
              print("Unexpected session types:", dict(unknown_types))
              if indexes["live"] is None:
                  print("Live-attendance responses: Column unavailable")
              else:
                  print(
                      "Live-attendance responses:",
                      dict(sorted(live_counts.items()))
                  )
                  print(
                      "Live-attendance responses by session type:",
                      {
                          key: dict(sorted(value.items()))
                          for key, value in sorted(live_by_type.items())
                      }
                  )
              print("Rows with complete deduplication signatures:", len(signatures))
              print("Duplicate signatures within this worksheet:",
                    len(signatures) - len(signature_set))

          first_gid, second_gid = sorted(CANDIDATE_GIDS)
          first = audits.get(first_gid, set())
          second = audits.get(second_gid, set())

          print("\n===== CROSS-WORKSHEET COMPARISON =====")
          print(f"Worksheet GID {first_gid} complete signatures:", len(first))
          print(f"Worksheet GID {second_gid} complete signatures:", len(second))
          print("Matching signatures across both worksheets:", len(first & second))
          print("Unique signatures across both worksheets:", len(first | second))

          first_only = first - second
          second_only = second - first

          print(f"\nOnly in first worksheet: {len(first_only)}")
          details = audit_details.get(first_gid, {})
          for signature_hash in sorted(first_only):
              record = details.get(signature_hash)
              if record is None:
                  print("Diagnostic metadata unavailable.")
                  continue
              print({
                  "session_date": record["session_date"],
                  "session_type": record["session_type"],
                  "live_column_available": record["live_column_available"],
                  "live_status": record["live_status"],
              })

          print(f"\nOnly in second worksheet: {len(second_only)}")
          print("Details suppressed for this worksheet; count only.")

          print("No emails, submission timestamps, free-text responses, or raw row contents were printed.")
          print("No database was accessed and no records were modified.")
          PY
